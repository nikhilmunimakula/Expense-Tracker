<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Expense</h1>

    <div class="card">

        <form action="/update/{{ expense[0] }}" method="POST">

            <div class="form-group">

                <label>Amount</label>

                <input
                    type="number"
                    name="amount"
                    step="0.01"
                    value="{{ expense[1] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    value="{{ expense[2] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <input
                    type="text"
                    name="description"
                    value="{{ expense[3] }}"
                >

            </div>


            <button type="submit">
                Update Expense
            </button>

            <a href="/">
                <button type="button">
                    Cancel
                </button>
            </a>

        </form>

    </div>

</div>

</body>

</html>
